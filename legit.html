<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legit Contact</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .contact-card { background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .contact-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; margin: 12px 0; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 1.1rem; box-sizing: border-box; }
        
        .whatsapp { background-color: #25D366; }
        .whatsapp:hover { background-color: #128C7E; }
        .line { background-color: #00B900; }
        .line:hover { background-color: #009900; }
        .voice { background-color: #333333; }
        .voice:hover { background-color: #000000; }
        
        .back-link { display: inline-block; margin-top: 20px; color: #666; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="contact-card">
        <h2>Get in Touch</h2>
        <p style="color: #666; margin-bottom: 30px;">Reach out securely via your preferred channel.</p>
        
        <!-- Replace YOUR_NUMBER and YOUR_LINE_ID with your actual details -->
        <a href="https://wa.me/YOUR_NUMBER" class="contact-btn whatsapp">🟢 WhatsApp</a>
        <a href="https://line.me/ti/p/YOUR_LINE_ID" class="contact-btn line">💬 LINE</a>
        <a href="tel:+YOUR_NUMBER" class="contact-btn voice">📞 Voice Call</a>
        
        <a href="/" class="back-link">← Back to Main Product</a>
    </div>
</body>
</html>
